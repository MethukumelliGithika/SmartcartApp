{% extends "base.html" %}

{% block title %}Product Details{% endblock %}

{% block content %}

<a href="/admin/item-list" class="btn btn-outline-secondary btn-sm mb-3">← Back to List</a>

<div class="card shadow-sm">
    <div class="row g-0">

        <div class="col-md-5 text-center p-4 bg-white">
            <img src="/static/uploads/product_images/{{ product.image }}"
                 class="img-fluid product-detail-img" alt="{{ product.name }}">
        </div>

        <div class="col-md-7">
            <div class="card-body p-4">
                <h2>{{ product.name }}</h2>
                <span class="badge bg-secondary mb-3">{{ product.category }}</span>
                <h3 class="text-success">₹{{ product.price }}</h3>
                <p>{{ product.description }}</p>

                <a href="/admin/update-item/{{ product.product_id }}" class="btn btn-primary">Update</a>
            </div>
        </div>

    </div>
</div>

{% endblock %}
