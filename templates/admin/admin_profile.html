{% extends "base.html" %}

{% block title %}Admin Profile{% endblock %}

{% block content %}
<div class="card shadow mx-auto" style="max-width:600px;">
    <div class="card-body p-4">
        <h3 class="mb-4">Admin Profile</h3>

        <div class="text-center mb-4">
            {% if admin.profile_image %}
                <img src="/static/uploads/admin_profiles/{{ admin.profile_image }}"
                     width="120" height="120" class="rounded-circle border" style="object-fit:cover;">
            {% else %}
                <p class="text-muted">No Profile Image</p>
            {% endif %}
        </div>

        <form method="POST" action="/admin/profile" enctype="multipart/form-data">

            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" name="name" class="form-control" value="{{ admin.name }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" value="{{ admin.email }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">New Password (optional)</label>
                <input type="password" name="password" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Upload New Profile Image (optional)</label>
                <input type="file" name="profile_image" class="form-control" accept="image/*">
            </div>

            <button type="submit" class="btn btn-primary">Update Profile</button>
            <a href="/admin-dashboard" class="btn btn-outline-secondary">Back to Dashboard</a>
        </form>
    </div>
</div>
{% endblock %}
