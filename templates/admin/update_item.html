{% extends "base.html" %}

{% block title %}Update Product{% endblock %}

{% block content %}
<div class="card shadow mx-auto" style="max-width:650px;">
    <div class="card-body p-4">
        <h3 class="mb-4">Update Product</h3>

        <form method="POST" action="/admin/update-item/{{ product.product_id }}" enctype="multipart/form-data">

            <div class="mb-3">
                <label class="form-label">Product Name</label>
                <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3" required>{{ product.description }}</textarea>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Category</label>
                    <input type="text" name="category" class="form-control" value="{{ product.category }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Price (₹)</label>
                    <input type="number" step="0.01" name="price" class="form-control" value="{{ product.price }}" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label d-block">Old Image</label>
                <img src="/static/uploads/product_images/{{ product.image }}" class="img-thumbnail" width="120">
            </div>

            <div class="mb-3">
                <label class="form-label">Choose New Image (Optional)</label>
                <input type="file" name="image" class="form-control" accept="image/*">
            </div>

            <button type="submit" class="btn btn-primary">Update Product</button>
            <a href="/admin/item-list" class="btn btn-outline-secondary">Back to Product List</a>
        </form>
    </div>
</div>
{% endblock %}
