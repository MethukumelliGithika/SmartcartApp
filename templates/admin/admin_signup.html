{% extends "base.html" %}

{% block title %}Admin Registration{% endblock %}

{% block content %}
<div class="card shadow auth-card">
    <div class="card-body p-4">
        <h3 class="text-center mb-4">Admin Registration</h3>

        <form method="POST" action="/admin-signup">
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" name="name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-dark w-100">Send OTP</button>
        </form>

        <p class="text-center mt-3 mb-0">Already registered? <a href="/admin-login">Login</a></p>
    </div>
</div>
{% endblock %}
