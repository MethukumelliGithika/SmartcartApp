{% extends "base.html" %}

{% block title %}My Profile{% endblock %}

{% block content %}
<div class="card shadow mx-auto" style="max-width:600px;">
    <div class="card-body p-4">

        <h3 class="mb-4">My Profile</h3>

        <!-- Profile picture -->
        <div class="text-center mb-4">
            {% if user.profile_image %}
                <img src="/static/uploads/user_profiles/{{ user.profile_image }}"
                     width="120" height="120" class="rounded-circle border" style="object-fit:cover;">
            {% else %}
                <div class="rounded-circle d-inline-flex align-items-center justify-content-center border"
                     style="width:120px;height:120px;background:var(--sc-lavender);font-size:3rem;font-weight:700;color:var(--sc-deep-hover);">
                    {{ user.name[0]|upper }}
                </div>
            {% endif %}
            <h5 class="mt-3 mb-0">{{ user.name }}</h5>
            <small class="text-muted">{{ user.email }}</small>
        </div>

        <form method="POST" action="/user/profile" enctype="multipart/form-data">

            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">New Password (optional)</label>
                <input type="password" name="password" class="form-control" placeholder="Leave empty to keep old password">
            </div>

            <div class="mb-3">
                <label class="form-label">Upload New Profile Image (optional)</label>
                <input type="file" name="profile_image" class="form-control" accept="image/*">
            </div>

            <button type="submit" class="btn btn-primary">Update Profile</button>
            <a href="/user-dashboard" class="btn btn-outline-secondary">Back to Dashboard</a>
        </form>

    </div>
</div>
{% endblock %}
